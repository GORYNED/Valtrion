name: privacy-text

# Checks the text of issues and comments (and of review comments) for real project, device, machine or person names, private addresses and
# user folders (tools/check_privacy.py --text-file). It runs again when the text is edited. The pull request itself is checked by privacy.yml.
# Only the code of the default branch runs here, and the text reaches the script through the environment, not through the shell line.

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  text:
    name: no private names in the text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check the title and text
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          printf '%s\n%s\n%s\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" "$COMMENT_BODY" "$REVIEW_BODY" > "$RUNNER_TEMP/text.txt"
          python tools/check_privacy.py --no-branch --text-file "$RUNNER_TEMP/text.txt"
