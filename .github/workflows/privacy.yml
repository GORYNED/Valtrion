name: privacy

# Checks that a pull request adds no real project, device, machine or person names, private addresses or user folders (tools/check_privacy.py).
# Images cannot be read by the script: it lists them, a person looks at them.

on:
  pull_request:

permissions:
  contents: read

jobs:
  names:
    name: no private names in the change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check what the pull request adds, its commit messages, title and text
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
          python tools/check_privacy.py --base "origin/$BASE_REF" --text-file "$RUNNER_TEMP/pull-request.txt"
