[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "valtrion"
version = "0.20.0"
description = "Repeatable checks, supervised execution and verifiable evidence on local and SSH hosts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["testing", "validation", "supervision", "unity", "evidence"]
authors = [{ name = "GORYNED" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/GORYNED/Valtrion"
Documentation = "https://github.com/GORYNED/Valtrion/blob/main/docs/quick-start.md"
Changelog = "https://github.com/GORYNED/Valtrion/blob/main/CHANGELOG.md"
Issues = "https://github.com/GORYNED/Valtrion/issues"

[project.scripts]
valtrion = "valtrion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["valtrion"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["valtrion", "tests", "README.md", "hatch_build.py"]
